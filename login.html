<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Attendance System - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo-icon">📱</div>
                <h1>QR Attendance</h1>
                <p>Smart Attendance Management System</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role" name="role" required>
                        <option value="">Select your role</option>
                        <option value="admin">Admin</option>
                        <option value="teacher">Teacher</option>
                        <option value="student">Student</option>
                    </select>
                    <span class="error-message" id="roleError"></span>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>

                <button type="submit" class="btn-login">
                    <span id="loginText">Login</span>
                    <span id="loginSpinner" class="spinner" style="display: none;"></span>
                </button>

                <span class="error-message" id="formError"></span>
            </form>

            <div class="login-footer">
                <p>Test Credentials:</p>
                <small>Admin: admin@gmail.com / admin123</small><br>
                <small>Teacher: teacher1@college.com / teacher123</small><br>
                <small>Student: student1@college.com / student123</small>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
